name: NSE options signal bot

# Runs the monitor loop once per trading day inside a GitHub-hosted runner.
# GitHub cron is UTC and can start several minutes late; the bot itself uses
# IST (TZ below) so its timings stay correct regardless.
on:
  schedule:
    # GitHub sometimes delays or skips a scheduled run, so there are 4 start times, 5 minutes
    # apart, as backups (Monday-Friday, IST in brackets). Only one session ever runs: the
    # others queue behind it (see "concurrency") and then exit immediately because the
    # session is over.
    - cron: "45 3 * * 1-5"      # 09:15 IST
    - cron: "50 3 * * 1-5"      # 09:20 IST
    - cron: "55 3 * * 1-5"      # 09:25 IST
    - cron: "0 4 * * 1-5"       # 09:30 IST
  workflow_dispatch:             # "Run workflow" button for manual tests
    inputs:
      session_end:
        description: "End the session at this IST time (HH:MM)"
        default: "15:10"
      already_alerted:
        description: "Restart helper: stocks/indexes that already alerted today, comma-separated (e.g. NIFTY,BANKNIFTY,ITC). They stay quiet."
        default: ""

# Never let two sessions overlap (they would both answer Telegram commands).
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Backstop only - the bot ends itself at SESSION_END (default 15:10 = full market day,
    # fine for a public repo). For a PRIVATE repo set repo variables SESSION_END=10:30 and
    # JOB_TIMEOUT_MIN=100 to stay inside the 2,000 free minutes/month.
    timeout-minutes: ${{ fromJSON(vars.JOB_TIMEOUT_MIN || '360') }}
    env:
      TZ: Asia/Kolkata
      TB_SCAN_INTERVAL: "10"
      ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
      ANGELONE_CLIENT_CODE: ${{ secrets.ANGELONE_CLIENT_CODE }}
      ANGELONE_PIN: ${{ secrets.ANGELONE_PIN }}
      ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
      TB_TELEGRAM_TOKEN: ${{ secrets.TB_TELEGRAM_TOKEN }}
      TB_TELEGRAM_CHAT_ID: ${{ secrets.TB_TELEGRAM_CHAT_ID }}
      SESSION_END: ${{ github.event.inputs.session_end || vars.SESSION_END || '15:10' }}
      ALREADY_ALERTED: ${{ github.event.inputs.already_alerted || '' }}
    steps:
      - name: Skip if today's session end time has already passed
        id: guard
        shell: bash
        run: |
          now=$(date +%H:%M)
          if [[ "$now" < "$SESSION_END" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "It is $now IST, past the session end $SESSION_END - nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
        if: steps.guard.outputs.go == 'true'
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.go == 'true'
      - name: Run bot until session end
        if: steps.guard.outputs.go == 'true'
        shell: bash   # enables pipefail so a crash fails the job
        run: python -u main.py --mode monitor --paper --broker angelone --strict --skip-if-closed --session-end "$SESSION_END" --already-alerted "$ALREADY_ALERTED" 2>&1 | tee monitor.log
      - name: Save logs and paper trades
        if: always() && steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bot-${{ github.run_id }}
          path: |
            monitor.log
            paper_trades.csv
            trade_results.csv
          if-no-files-found: ignore
          retention-days: 90
      - name: Tell me on Telegram if the run failed
        if: failure() && steps.guard.outputs.go == 'true'
        run: |
          curl -s "https://api.telegram.org/bot${TB_TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TB_TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❌ Trading bot run FAILED today. Check the Actions tab: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
